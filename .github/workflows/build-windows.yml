name: Build Desktop Note Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DesktopNote.exe
        shell: cmd
        run: |
          chcp 65001 >nul
          cl.exe /nologo /O2 /EHsc /std:c++17 /utf-8 DesktopNote.cpp /Fe:DesktopNote.exe user32.lib gdi32.lib comctl32.lib comdlg32.lib
          if not exist DesktopNote.exe exit /b 1

      - name: Upload DesktopNote.exe
        uses: actions/upload-artifact@v4
        with:
          name: DesktopNote-Windows-x64
          path: DesktopNote.exe
